<section id="fun-project" class="home-section project-section">
  <h2 class="section-title">Fun Projects</h2>

  <div class="project-grid">
    {% for project in include.projects %}
      <article class="project-card">
        <a href="{{ project.url | relative_url }}">
          <span class="project-card-media">
            <img
              src="{{ project.image | relative_url }}"
              alt="{{ project.title }}"
              loading="lazy"
            >
          </span>
          <span class="project-card-title">{{ project.title }}</span>
        </a>
      </article>
    {% endfor %}
  </div>
</section>
