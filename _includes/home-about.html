<section id="home" class="home-section about-section">
  <div class="about-grid">
    {% if include.profile.images %}
      <div
        class="profile-carousel"
        data-profile-carousel
        role="group"
        aria-label="{{ include.profile.name }} profile photos"
      >
        <div class="profile-carousel-frame">
          {% for image in include.profile.images %}
            <img
              src="{{ image.src | relative_url }}"
              alt="{{ image.alt | default: include.profile.name }}"
              class="profile-photo{% if forloop.first %} profile-photo--active{% endif %}"
              data-profile-image
              {% unless forloop.first %}hidden{% endunless %}
            >
          {% endfor %}

          {% if include.profile.images.size > 1 %}
            <button
              type="button"
              class="profile-carousel-button profile-carousel-button--prev"
              data-profile-prev
              aria-label="Previous profile photo"
            >&lsaquo;</button>
            <button
              type="button"
              class="profile-carousel-button profile-carousel-button--next"
              data-profile-next
              aria-label="Next profile photo"
            >&rsaquo;</button>
          {% endif %}
        </div>
      </div>
    {% else %}
      <img
        src="{{ include.profile.image | relative_url }}"
        alt="{{ include.profile.name }}"
        class="profile-photo"
      >
    {% endif %}

    <div class="about-copy">
      <h1 class="profile-name">{{ include.profile.name }}</h1>
      <p class="profile-intro">{{ include.profile.intro }}</p>
      <p class="profile-vision">My Vision: {{ include.profile.vision }}</p>
      <p class="profile-bio">{{ include.profile.bio }}</p>
    </div>
  </div>
</section>

<script src="{{ '/profile-carousel.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
