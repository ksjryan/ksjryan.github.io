intro: >-
  Hello! My name is Seongjun (Ryan) Kang, and I am currently a Ph.D.
  candidate at the HCIS Lab of Gwangju Institute of Science and Technology
  (GIST).
vision: "rewiring & restoring sensory gaps to bridge digital and physical worlds"
bio: >-
  My research primarily focuses on haptic technology within Virtual Reality. I
  am dedicated to developing hardware and software that seamlessly integrate
  various human senses. This involves designing innovative interfaces and
  exploring the potential of human somatosensory perception to create more
  immersive and intuitive interactions. By bridging the gap between the virtual
  and physical worlds, my goal is to contribute to a more nuanced and engaging
  user experience.
